[project]
name = "agent-graph"
version = "0.1.0"
description = "Parallel agent graph: LangGraph fan-out/fan-in, HITL pause/resume, durable checkpoints"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vertex = ["google-genai>=1.0"]   # only needed when AGENT_GRAPH_FAKE_LLM is off
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
